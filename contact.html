<section class="page">

    <h1>Contact Us</h1>

    <p>Have a question? Send us a message.</p>

    <form id="contactForm">

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Your Email"
            required
        >

        <textarea
            id="message"
            placeholder="Your Message"
            rows="6"
            required
        ></textarea>

        <button type="submit">Send Message</button>

    </form>

</section>
